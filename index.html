<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>💌 Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:#fff;
    user-select:none;-webkit-user-select:none;
  }

  /* ===== ẢNH NỀN ===== */
  #bgPhoto{
    position:fixed;inset:0;z-index:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity 1.8s ease;
    will-change:transform;
  }
  #bgPhoto.show{ opacity:1; }
  #bgPhoto.kenburns{ animation:kb 22s ease-in-out infinite alternate; }
  @keyframes kb{
    0%   { transform:scale(1)    translate(0,0); }
    100% { transform:scale(1.12) translate(-1.5%,-1.5%); }
  }

  #bgOverlay{
    position:fixed;inset:0;z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 40%,
        rgba(5,2,16,.35) 0%,
        rgba(5,2,16,.65) 60%,
        rgba(5,2,16,.92) 100%);
    opacity:0;
    transition:opacity 1.8s ease;
  }
  #bgOverlay.show{ opacity:1; }

  /* Canvas 1: tim bay */
  #heartsCv{
    position:fixed;inset:0;z-index:2;
    display:block;width:100vw;height:100vh;
    pointer-events:none;
  }

  /* Canvas 2: chữ hạt sáng */
  #nameCv{
    position:fixed;inset:0;z-index:3;
    display:block;width:100vw;height:100vh;
    pointer-events:none;
  }

  /* ===== COUNTDOWN ===== */
  #countdown{
    position:fixed;inset:0;z-index:15;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .count-num{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(120px, 32vw, 260px);
    font-weight:700;
    color:#fff;
    line-height:1;
    letter-spacing:4px;
    text-shadow:
      0 0 20px rgba(255,255,255,.95),
      0 0 50px rgba(0,255,180,.7),
      0 0 100px rgba(0,255,180,.4),
      0 0 160px rgba(255,142,199,.3);
    opacity:0;
    transform:scale(0.3);
    will-change:transform,opacity;
  }
  .count-boom{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(80px, 22vw, 180px);
    font-weight:700;
    color:#fff;
    text-shadow:
      0 0 30px #fff,
      0 0 60px #00ffb4,
      0 0 120px #ff8ec7;
    animation:boom 0.9s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes boom{
    0%   { opacity:1; transform:scale(1); }
    35%  { opacity:1; transform:scale(1.9); filter:blur(2px); }
    100% { opacity:0; transform:scale(3.4); filter:blur(20px); }
  }

  #shockwave{
    position:fixed;
    top:50%;left:50%;
    width:20px;height:20px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,1) 0%,
      rgba(0,255,180,.7) 30%,
      rgba(255,142,199,.4) 60%,
      transparent 100%);
    transform:translate(-50%,-50%) scale(0);
    z-index:14;
    pointer-events:none;
    opacity:0;
  }
  #shockwave.go{ animation:shock 1.4s cubic-bezier(.15,.9,.3,1) forwards; }
  @keyframes shock{
    0%   { transform:translate(-50%,-50%) scale(0);  opacity:1; }
    60%  { transform:translate(-50%,-50%) scale(60); opacity:.7; }
    100% { transform:translate(-50%,-50%) scale(120);opacity:0; }
  }

  #flash{
    position:fixed;inset:0;z-index:18;
    background:radial-gradient(circle at center,
      rgba(255,255,255,.98) 0%,
      rgba(255,220,240,.6) 30%,
      transparent 70%);
    opacity:0;
    pointer-events:none;
  }
  #flash.go{ animation:flashAnim .8s ease-out forwards; }
  @keyframes flashAnim{
    0%   { opacity:1; }
    100% { opacity:0; }
  }

  /* ===== NÚT ===== */
  #topBar{
    position:fixed;
    top:max(14px, env(safe-area-inset-top));
    right:14px;
    z-index:20;
    display:flex;gap:8px;
    opacity:0;
    transition:opacity .8s;
    pointer-events:none;
  }
  #topBar.show{ opacity:1; pointer-events:auto; }

  .btn{
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.4px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:all .2s;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .btn:active{
    background:rgba(255,255,255,.24);
    transform:scale(.94);
  }
  #btnMusic.pulse{
    animation:mp 1.6s ease-in-out infinite;
    background:linear-gradient(135deg,rgba(255,154,60,.5),rgba(255,95,162,.5));
    border-color:rgba(255,215,110,.75);
  }
  @keyframes mp{
    0%,100%{ transform:scale(1); box-shadow:0 0 18px rgba(255,180,100,.5); }
    50%    { transform:scale(1.08); box-shadow:0 0 30px rgba(255,180,100,.95); }
  }

  /* ===== LỜI CHÚC ===== */
  #wishes{
    position:fixed;
    bottom:max(20%, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:min(94%, 600px);
    text-align:center;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    font-size:17px;
    font-weight:500;
    line-height:1.8;
    letter-spacing:.3px;
    color:#ffffff;
    text-shadow:
      0 2px 12px rgba(0,0,0,1),
      0 4px 24px rgba(0,0,0,.95),
      0 0 40px rgba(0,0,0,.8),
      0 0 60px rgba(255,200,220,.25);
    opacity:0;
    transition:opacity 1.5s;
    padding:16px 14px;
    pointer-events:none;
    background:radial-gradient(ellipse at center,
      rgba(5,2,16,.65) 0%,
      rgba(5,2,16,.4) 45%,
      transparent 78%);
    border-radius:24px;
  }
  #wishes.show{ opacity:1; }
  #wishes .cursor{
    display:inline-block;
    width:2.5px;
    height:1em;
    background:#ffd76e;
    vertical-align:-2px;
    margin-left:3px;
    box-shadow:0 0 10px #ffd76e, 0 0 20px rgba(255,215,110,.6);
    animation:blink .8s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0 } }

  /* Màn hình ngang */
  @media (orientation:landscape){
    #wishes{
      bottom:8%;
      font-size:14px;
      line-height:1.7;
      width:min(78%, 720px);
    }
  }

  /* Màn hình dọc nhỏ (iPhone SE) */
  @media (orientation:portrait) and (max-width:375px){
    #wishes{
      font-size:13.5px;
      line-height:1.75;
      bottom:max(22%, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<div id="bgPhoto"></div>
<div id="bgOverlay"></div>

<canvas id="heartsCv"></canvas>
<canvas id="nameCv"></canvas>

<div id="countdown"></div>
<div id="shockwave"></div>
<div id="flash"></div>

<div id="wishes"></div>

<div id="topBar">
  <button class="btn" id="btnMusic">🔊 Nhạc</button>
  <button class="btn" id="btnAgain">↻ Chơi lại</button>
</div>

<audio id="bgm" loop preload="auto"></audio>

<script>
/* ============================================================
   CẤU HÌNH — SỬA Ở ĐÂY
============================================================ */
const CONFIG = {
  name: 'Em iu',
  photo: 'IMG_5537.jpeg',
  music: 'chua mot lan a thay hoi han.mp3',
  countFrom: 3,

  wishes: [
    'Em iu à, sinh nhật em mà anh lại chẳng thể ở bên.',
    'Anh xin lỗi nhé. ❤️',
    'Dù mình đang xa nhau, nhưng tình cảm anh dành cho em',
    'chưa bao giờ là xa cả.',
    'Anh chỉ mong em luôn vui, luôn bình an',
    'và biết rằng ở đâu đó vẫn có một người',
    'rất thương em và luôn nhớ về em.',
    'Chúc em sinh nhật thật hạnh phúc. Anh yêu em.'
  ]
};
/* ============================================================ */

const bgPhoto  = document.getElementById('bgPhoto');
const bgOverlay= document.getElementById('bgOverlay');

const heartsCv = document.getElementById('heartsCv');
const hctx     = heartsCv.getContext('2d');

const nameCv   = document.getElementById('nameCv');
const nctx     = nameCv.getContext('2d');

const countdownEl = document.getElementById('countdown');
const shockwaveEl = document.getElementById('shockwave');
const flashEl     = document.getElementById('flash');

const wishesEl = document.getElementById('wishes');
const topBar   = document.getElementById('topBar');
const btnAgain = document.getElementById('btnAgain');
const btnMusic = document.getElementById('btnMusic');
const bgm      = document.getElementById('bgm');

let W = 0, H = 0, DPR = 1;
let isPortrait = true;
let nameDots = [];
let nameDone = false;
let hearts = [];
let heartsOn = false;
let gen = 0;

/* ============================================================
   ẢNH NỀN
============================================================ */
function revealBackground(myGen){
  if (!CONFIG.photo) return;

  bgPhoto.style.backgroundImage = `url("${CONFIG.photo}")`;

  const img = new Image();
  img.onload = () => {
    if (myGen !== gen) return;
    bgPhoto.classList.add('show');
    bgOverlay.classList.add('show');
    setTimeout(() => {
      if (myGen !== gen) return;
      bgPhoto.classList.add('kenburns');
    }, 800);
  };
  img.onerror = () => {
    if (myGen !== gen) return;
    bgOverlay.classList.add('show');
  };
  img.src = CONFIG.photo;
}

/* ============================================================
   TIM BAY LÊN
============================================================ */
function spawnHeart(){
  hearts.push({
    x: Math.random() * W,
    y: H + 30,
    vy: -(0.7 + Math.random() * 1.3),
    drift: (Math.random() - 0.5) * 0.7,
    size: (8 + Math.random() * 14) * DPR,
    rot: (Math.random() - 0.5) * 0.6,
    vr: (Math.random() - 0.5) * 0.02,
    alpha: 0,
    hue: 320 + Math.random() * 40
  });
}

function drawHearts(){
  for (let i = hearts.length - 1; i >= 0; i--){
    const h = hearts[i];
    h.y += h.vy;
    h.x += Math.sin(h.y * 0.01) * 0.6 + h.drift;
    h.rot += h.vr;
    h.alpha = Math.min(1, h.alpha + 0.02);

    if (h.y < -60){
      hearts.splice(i, 1);
      continue;
    }

    const fade = h.y < H * 0.25 ? h.y / (H * 0.25) : 1;
    const a = h.alpha * fade * 0.75;

    hctx.save();
    hctx.globalAlpha = a;
    hctx.translate(h.x, h.y);
    hctx.rotate(h.rot);

    const s = h.size;
    const g = hctx.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, `hsl(${h.hue},95%,78%)`);
    g.addColorStop(1, `hsl(${h.hue + 30},95%,58%)`);
    hctx.fillStyle = g;

    hctx.beginPath();
    hctx.moveTo(0, s * 0.35);
    hctx.bezierCurveTo(0, 0, -s, 0, -s, s * 0.45);
    hctx.bezierCurveTo(-s, s * 0.9, 0, s * 1.15, 0, s * 1.5);
    hctx.bezierCurveTo(0, s * 1.15, s, s * 0.9, s, s * 0.45);
    hctx.bezierCurveTo(s, 0, 0, 0, 0, s * 0.35);
    hctx.closePath();
    hctx.fill();

    hctx.restore();
  }
}

/* ============================================================
   COUNTDOWN 3 → 2 → 1 → 0
============================================================ */
function startCountdown(myGen, onFinish){
  const from = CONFIG.countFrom || 3;
  let current = from;

  function showNumber(n){
    if (myGen !== gen) return;

    const el = document.createElement('div');
    el.className = 'count-num';
    el.textContent = n;
    countdownEl.innerHTML = '';
    countdownEl.appendChild(el);

    if (n === 1){
      el.style.textShadow = `
        0 0 20px rgba(255,255,255,.95),
        0 0 50px rgba(255,80,120,.9),
        0 0 100px rgba(255,80,120,.5),
        0 0 160px rgba(255,60,100,.3)`;
    } else if (n === 2){
      el.style.textShadow = `
        0 0 20px rgba(255,255,255,.95),
        0 0 50px rgba(255,180,80,.8),
        0 0 100px rgba(255,180,80,.4)`;
    }

    requestAnimationFrame(() => {
      el.animate([
        { opacity: 0, transform: 'scale(0.3)' },
        { opacity: 1, transform: 'scale(1.15)', offset: 0.35 },
        { opacity: 1, transform: 'scale(1)',    offset: 0.6 },
        { opacity: 0, transform: 'scale(0.85)' }
      ], {
        duration: 900,
        easing: 'cubic-bezier(.2,.9,.3,1)',
        fill: 'forwards'
      });
    });
  }

  function tick(){
    if (myGen !== gen) return;

    if (current > 0){
      showNumber(current);
      current--;
      setTimeout(tick, 850);
    } else {
      showNumber(0);
      setTimeout(() => {
        if (myGen !== gen) return;
        boom(myGen, onFinish);
      }, 700);
    }
  }

  tick();
}

/* ============================================================
   NỔ
============================================================ */
function boom(myGen, onFinish){
  if (myGen !== gen) return;

  countdownEl.innerHTML = '';
  const boomEl = document.createElement('div');
  boomEl.className = 'count-boom';
  boomEl.textContent = '0';
  countdownEl.appendChild(boomEl);

  shockwaveEl.classList.remove('go');
  void shockwaveEl.offsetWidth;
  shockwaveEl.classList.add('go');

  flashEl.classList.remove('go');
  void flashEl.offsetWidth;
  flashEl.classList.add('go');

  setTimeout(() => {
    if (myGen !== gen) return;
    countdownEl.innerHTML = '';
    onFinish();
  }, 550);
}

/* ============================================================
   CHỮ XẾP BẰNG HẠT SÁNG
============================================================ */
function buildNameDots(){
  nameDots = [];

  const off = document.createElement('canvas');
  off.width  = Math.max(1, Math.floor(W));
  off.height = Math.max(1, Math.floor(H));
  const o = off.getContext('2d');

  o.fillStyle = '#fff';
  o.textAlign = 'center';
  o.textBaseline = 'middle';

  const name  = (CONFIG.name || '').toUpperCase();
  const line1 = 'HAPPY';
  const line2 = 'BIRTHDAY';

  let size1, size2, size3;
  let y1, y2, y3;
  const cx = W / 2;

  if (isPortrait){
    size2 = Math.min(W * 0.28, 72);
    size1 = size2 * 0.92;
    size3 = size2 * 0.82;

    const startY = H * 0.09;
    y1 = startY;
    y2 = startY + size1 * 1.15;
    y3 = y2 + size2 * 1.25;
  } else {
    size2 = Math.min(W * 0.13, H * 0.20);
    size1 = size2 * 0.92;
    size3 = size2 * 0.82;

    const startY = H * 0.16;
    y1 = startY;
    y2 = startY + size1 * 1.15;
    y3 = y2 + size2 * 1.25;
  }

  o.font = `900 ${size1}px 'Be Vietnam Pro', sans-serif`;
  o.fillText(line1, cx, y1);

  o.font = `900 ${size2}px 'Be Vietnam Pro', sans-serif`;
  o.fillText(line2, cx, y2);

  o.font = `700 ${size3}px 'Be Vietnam Pro', sans-serif`;
  o.fillText(name, cx, y3);

  const data = o.getImageData(0, 0, off.width, off.height).data;
  const step = isPortrait
    ? Math.max(2, Math.floor(2.5 * DPR))
    : Math.max(2, Math.floor(3 * DPR));

  for (let y = 0; y < off.height; y += step){
    for (let x = 0; x < off.width; x += step){
      const i = (y * off.width + x) * 4;
      if (data[i + 3] > 128){
        const angle = Math.random() * Math.PI * 2;
        const dist  = 50 + Math.random() * 220;
        nameDots.push({
          x: W / 2 + Math.cos(angle) * dist,
          y: H / 2 + Math.sin(angle) * dist,
          tx: x,
          ty: y,
          r: (0.95 + Math.random() * 0.35) * DPR,
          alpha: 0,
          phase: Math.random() * Math.PI * 2,
          speed: 0.04 + Math.random() * 0.06,
          isCyan: Math.random() < 0.06
        });
      }
    }
  }
}

function drawNameDots(){
  let allDone = true;

  for (const p of nameDots){
    p.x += (p.tx - p.x) * 0.09;
    p.y += (p.ty - p.y) * 0.09;
    p.alpha += (1 - p.alpha) * 0.08;

    if (Math.abs(p.x - p.tx) > 0.8 || Math.abs(p.y - p.ty) > 0.8){
      allDone = false;
    }

    p.phase += p.speed;
    const tw = 0.8 + Math.sin(p.phase) * 0.2;
    const a  = p.alpha;

    if (p.isCyan){
      nctx.beginPath();
      nctx.arc(p.x, p.y, p.r * 1.5, 0, Math.PI * 2);
      nctx.fillStyle = `rgba(0, 255, 200, ${a * 0.30})`;
      nctx.fill();

      nctx.beginPath();
      nctx.arc(p.x, p.y, p.r * tw * 0.95, 0, Math.PI * 2);
      nctx.fillStyle = `rgba(200, 255, 245, ${a})`;
      nctx.fill();
    } else {
      nctx.beginPath();
      nctx.arc(p.x, p.y, p.r * tw, 0, Math.PI * 2);
      nctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      nctx.fill();
    }
  }

  if (allDone && !nameDone){
    nameDone = true;
    setTimeout(showWishes, 400);
    setTimeout(() => topBar.classList.add('show'), 1200);
  }
}

/* ============================================================
   LỜI CHÚC
============================================================ */
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function showWishes(){
  const text = CONFIG.wishes.join('\n');
  let i = 0;
  wishesEl.classList.add('show');
  const cursor = '<span class="cursor"></span>';

  function tick(){
    if (i <= text.length){
      const shown = escapeHtml(text.slice(0, i)).replace(/\n/g, '<br>');
      wishesEl.innerHTML = shown + cursor;
      i++;
      setTimeout(tick, 30 + Math.random() * 38);
    } else {
      wishesEl.innerHTML = escapeHtml(text).replace(/\n/g, '<br>') + cursor;
    }
  }
  tick();
}

/* ============================================================
   VÒNG LẶP
============================================================ */
function loop(){
  hctx.clearRect(0, 0, W, H);
  if (heartsOn) drawHearts();

  nctx.clearRect(0, 0, W, H);
  if (nameDots.length > 0){
    nctx.globalCompositeOperation = 'lighter';
    drawNameDots();
    nctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   RESIZE
============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  isPortrait = H > W;

  [heartsCv, nameCv].forEach(c => {
    c.width  = Math.floor(W * DPR);
    c.height = Math.floor(H * DPR);
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  });

  if (nameDots.length > 0){
    buildNameDots();
  }
}

/* ============================================================
   NHẠC
============================================================ */
let musicOn = false;

function setupMusic(){
  if (!CONFIG.music){
    btnMusic.style.display = 'none';
    return;
  }

  bgm.src = CONFIG.music;
  bgm.volume = 0.55;

  bgm.play().then(() => {
    musicOn = true;
    updateMusicBtn();
  }).catch(() => {
    btnMusic.classList.add('pulse');
    const unlock = () => {
      bgm.play().then(() => {
        musicOn = true;
        updateMusicBtn();
        btnMusic.classList.remove('pulse');
      }).catch(()=>{});
      document.removeEventListener('click', unlock);
      document.removeEventListener('touchstart', unlock);
    };
    document.addEventListener('click', unlock);
    document.addEventListener('touchstart', unlock);
  });
}

function updateMusicBtn(){
  btnMusic.textContent = musicOn ? '🔊 Nhạc' : '🔇 Nhạc';
}

btnMusic.addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicOn){
    bgm.pause();
    musicOn = false;
  } else {
    bgm.play().then(() => { musicOn = true; updateMusicBtn(); });
  }
  updateMusicBtn();
});

/* ============================================================
   BẮT ĐẦU
============================================================ */
function startMain(){
  const myGen = ++gen;

  // Nền đen thuần khi đếm — ảnh chưa hiện
  heartsOn = true;
  for (let i = 0; i < 8; i++){
    setTimeout(() => { if (myGen === gen) spawnHeart(); }, i * 200);
  }

  startCountdown(myGen, () => {
    // Sau khi nổ xong → mới hiện ảnh nền
    if (myGen !== gen) return;
    revealBackground(myGen);
    buildNameDots();
  });
}

/* ============================================================
   RESET
============================================================ */
function resetAll(){
  gen++;
  nameDots = [];
  nameDone = false;
  hearts = [];
  heartsOn = false;

  wishesEl.innerHTML = '';
  wishesEl.classList.remove('show');
  topBar.classList.remove('show');
  countdownEl.innerHTML = '';

  bgPhoto.classList.remove('show','kenburns');
  bgOverlay.classList.remove('show');

  shockwaveEl.classList.remove('go');
  flashEl.classList.remove('go');

  nctx.clearRect(0, 0, W, H);
  hctx.clearRect(0, 0, W, H);

  setTimeout(startMain, 400);
}

btnAgain.addEventListener('click', (e) => {
  e.stopPropagation();
  resetAll();
});

/* ============================================================
   SỰ KIỆN
============================================================ */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

setInterval(() => {
  if (heartsOn && document.visibilityState === 'visible'){
    spawnHeart();
  }
}, 380);

/* ============================================================
   KHỞI ĐỘNG
============================================================ */
resize();
loop();
setupMusic();

function autoStart(){
  setTimeout(startMain, 800);
}
if (document.readyState === 'complete'){
  autoStart();
} else {
  window.addEventListener('load', autoStart);
}
</script>
</body>
