<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>💌 Chúc Mừng Sinh Nhật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffd76e;
    --pink:#ff8ec7;
    --purple:#a78bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#0b0620;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:#fff;user-select:none;
  }

  /* ===== ẢNH NỀN TOÀN MÀN HÌNH ===== */
  #bgPhoto{
    position:fixed;inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity 1.8s ease;
    will-change:transform;
  }
  #bgPhoto.show{opacity:1;}
  #bgPhoto.kenburns{
    animation:kenburns 24s ease-in-out infinite alternate;
  }
  @keyframes kenburns{
    0%   { transform:scale(1)    translate(0,0); }
    100% { transform:scale(1.15) translate(-2%,-2%); }
  }

  /* Lớp phủ tối để chữ nổi */
  #bgOverlay{
    position:fixed;inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(5,2,16,.45) 55%, rgba(5,2,16,.85) 100%),
      linear-gradient(180deg, rgba(5,2,16,.5) 0%, transparent 25%, transparent 60%, rgba(5,2,16,.8) 100%);
    opacity:0;
    transition:opacity 1.8s ease;
  }
  #bgOverlay.show{opacity:1;}

  /* Ánh sáng lung linh phủ trên ảnh */
  #bgShine{
    position:fixed;inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(circle at 30% 30%, rgba(255,215,110,.14), transparent 50%),
               radial-gradient(circle at 75% 70%, rgba(255,142,199,.12), transparent 55%);
    opacity:0;
    transition:opacity 2s ease;
  }
  #bgShine.show{opacity:1;}

  /* Canvas sao nằm trên ảnh nhưng dưới UI */
  canvas{position:fixed;inset:0;display:block;pointer-events:none}
  #nebula{z-index:3;mix-blend-mode:screen;opacity:0;transition:opacity 2s ease}
  #nebula.show{opacity:.7}
  #starfield{z-index:4;mix-blend-mode:screen}
  #fx{z-index:5}

  #ui{position:fixed;inset:0;z-index:6}

  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;transition:opacity .8s ease;
  }
  .scene.hidden{opacity:0;pointer-events:none}

  /* ===== INTRO ===== */
  #introScene{gap:26px}
  .gift-wrap{
    position:relative;width:150px;height:150px;
    display:flex;align-items:center;justify-content:center;
    animation:floaty 3.2s ease-in-out infinite;
  }
  .gift{
    font-size:92px;line-height:1;
    filter:drop-shadow(0 0 26px rgba(255,200,100,.85));
    animation:giftPulse 2.2s ease-in-out infinite;
  }
  .gift-wrap::before{
    content:'';position:absolute;inset:-32px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,110,.4),transparent 65%);
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes giftPulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
  @keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}

  .intro-text{
    text-align:center;font-size:17px;line-height:1.75;
    color:rgba(255,255,255,.92);letter-spacing:.3px;
    animation:fadeUp 1.1s ease both .25s;
    text-shadow:0 2px 20px rgba(0,0,0,.9);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{to{opacity:1}}

  /* ===== MAIN ===== */
  #mainScene{justify-content:flex-start;pointer-events:none}
  #mainScene>*{pointer-events:auto}

  .wish-box{
    position:absolute;top:58%;left:50%;transform:translateX(-50%);
    width:min(90%,560px);text-align:center;
    font-size:16px;line-height:2;
    color:#fff;
    text-shadow:
      0 2px 24px rgba(0,0,0,.95),
      0 0 40px rgba(0,0,0,.7);
    min-height:150px;
    font-weight:400;
    letter-spacing:.2px;
    background:radial-gradient(ellipse,rgba(10,5,25,.55),transparent 75%);
    padding:20px 10px;border-radius:20px;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .wish-box .cursor{
    display:inline-block;width:2px;height:1em;background:var(--gold);
    vertical-align:-2px;margin-left:2px;animation:blink .8s step-end infinite;
    box-shadow:0 0 8px var(--gold);
  }
  @keyframes blink{50%{opacity:0}}

  .cake-wrap{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:max(24px,env(safe-area-inset-bottom));
    opacity:0;
  }
  .cake-wrap.show{animation:fadeIn 1s ease forwards}
  .cake{
    display:block;font-size:66px;
    filter:
      drop-shadow(0 0 22px rgba(255,160,80,.85))
      drop-shadow(0 0 40px rgba(255,100,180,.5))
      drop-shadow(0 4px 12px rgba(0,0,0,.9));
  }
  .cake-wrap.show .cake{animation:cakeBob 3.2s ease-in-out infinite}
  @keyframes cakeBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* ===== NÚT ===== */
  .top-bar{
    position:absolute;
    top:max(18px,env(safe-area-inset-top));
    right:16px;
    display:flex;gap:8px;
    opacity:0;
    z-index:10;
  }
  .top-bar.show{animation:fadeIn .8s ease 1.6s forwards}
  .btn-ghost{
    padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
    color:rgba(255,255,255,.95);font-size:13px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .2s;
    box-shadow:0 4px 16px rgba(0,0,0,.35);
  }
  .btn-ghost:active{background:rgba(255,255,255,.22);transform:scale(.95)}

  #btnMusic.pulse{
    animation:musicPulse 1.6s ease-in-out infinite;
    background:linear-gradient(135deg,rgba(255,154,60,.45),rgba(255,95,162,.45));
    border-color:rgba(255,215,110,.7);
    box-shadow:0 0 20px rgba(255,180,100,.7);
  }
  @keyframes musicPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 20px rgba(255,180,100,.5); }
    50%    { transform:scale(1.08); box-shadow:0 0 32px rgba(255,180,100,.95); }
  }

  /* Landscape */
  @media (orientation:landscape){
    .wish-box{ top:50%;left:50%;transform:translate(-50%,-50%);
      font-size:15px;line-height:1.95;min-height:0;width:min(70%,700px); }
    .cake-wrap{ left:auto;right:5%;transform:none;bottom:6% }
    .cake{ font-size:48px }
  }
  @media (orientation:landscape) and (max-height:420px){
    .wish-box{ font-size:13px; }
  }
</style>
</head>
<body>

<!-- ẢNH NỀN -->
<div id="bgPhoto"></div>
<div id="bgOverlay"></div>
<div id="bgShine"></div>

<!-- HIỆU ỨNG -->
<canvas id="nebula"></canvas>
<canvas id="starfield"></canvas>
<canvas id="fx"></canvas>

<!-- NHẠC -->
<audio id="bgm" loop preload="auto"></audio>

<div id="ui">
  <section class="scene" id="introScene">
    <div class="gift-wrap"><div class="gift">🎁</div></div>
    <p class="intro-text">Có một điều đặc biệt<br>dành riêng cho bạn...</p>
  </section>

  <section class="scene hidden" id="mainScene">
    <div class="wish-box" id="wishBox"></div>
    <div class="cake-wrap" id="cakeWrap"><span class="cake">🎂</span></div>
    <div class="top-bar" id="topBar">
      <button class="btn-ghost" id="btnMusic" title="Bật nhạc">🔇 Nhạc</button>
      <button class="btn-ghost" id="btnAgain">↻ Xem lại</button>
    </div>
  </section>
</div>

<script>
/* =========================================================
   ⚙️  CẤU HÌNH — SỬA Ở ĐÂY
   ========================================================= */
const CONFIG = {
  name: 'Sơn',

  // 🖼️ ẢNH NỀN — dán link hoặc tên file
  //    Nên dùng ảnh ngang (landscape), kích thước ≥ 1920x1080
  photo: 'https://picsum.photos/1920/1080?random=1',

  // 🎵 Nhạc nền — để trống '' nếu không muốn nhạc
  music: '',

  // 💬 Lời chúc
  wishes: [
    'Chúc bạn tuổi mới ngập tràn niềm vui,',
    'thật nhiều sức khỏe và bình an.',
    'Mong mọi điều ước của bạn đều thành hiện thực,',
    'và mỗi ngày đều rực rỡ như ánh mặt trời! 💖'
  ]
};
/* ========================================================= */

const bgPhoto  = document.getElementById('bgPhoto');
const bgOverlay= document.getElementById('bgOverlay');
const bgShine  = document.getElementById('bgShine');
const nebulaCv = document.getElementById('nebula');
const nctx     = nebulaCv.getContext('2d');
const starCv   = document.getElementById('starfield');
const sctx     = starCv.getContext('2d');
const fxCv     = document.getElementById('fx');
const fctx     = fxCv.getContext('2d');

const introScene = document.getElementById('introScene');
const mainScene  = document.getElementById('mainScene');
const wishBox    = document.getElementById('wishBox');
const cakeWrap   = document.getElementById('cakeWrap');
const topBar     = document.getElementById('topBar');
const btnAgain   = document.getElementById('btnAgain');
const btnMusic   = document.getElementById('btnMusic');
const bgm        = document.getElementById('bgm');

let W = 0, H = 0, DPR = 1;
let stars = [];
let shootingStars = [];
let nameParticles = [];
let confetti = [];
let hearts = [];
let nebulaBlobs = [];

let phase = 'intro';
let gen = 0;
let heartsOn = false;
let musicOn = false;

/* ---------- SIZE ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  [nebulaCv, starCv, fxCv].forEach(c=>{
    c.width  = Math.floor(W * DPR);
    c.height = Math.floor(H * DPR);
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  });

  buildStars();
  buildNebula();
  if (phase !== 'intro') buildNameParticles();
}

/* ---------- TINH VÂN ---------- */
function buildNebula(){
  nebulaBlobs = [];
  const colors = [
    'rgba(120,50,180,0.28)',
    'rgba(200,60,140,0.20)',
    'rgba(60,80,200,0.22)',
    'rgba(180,120,60,0.14)'
  ];
  for (let i = 0; i < 4; i++){
    nebulaBlobs.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: 200 + Math.random()*220,
      color: colors[i],
      vx: (Math.random()-0.5)*0.12,
      vy: (Math.random()-0.5)*0.12
    });
  }
}

function drawNebula(){
  nctx.clearRect(0,0,W,H);
  for (const b of nebulaBlobs){
    b.x += b.vx; b.y += b.vy;
    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    if (b.y < -b.r) b.y = H + b.r;
    if (b.y > H + b.r) b.y = -b.r;

    const g = nctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, b.color);
    g.addColorStop(1, 'transparent');
    nctx.fillStyle = g;
    nctx.beginPath();
    nctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    nctx.fill();
  }
}

/* ---------- SAO ---------- */
function buildStars(){
  stars = [];
  const count = Math.floor((W * H) / 4200);
  for (let i = 0; i < count; i++){
    const roll = Math.random();
    let hue;
    if (roll < 0.72)      hue = 50;
    else if (roll < 0.88) hue = 320;
    else                  hue = 205;

    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.35 + 0.3,
      a: Math.random()*Math.PI*2,
      speed: 0.006 + Math.random()*0.02,
      hue
    });
  }
}

function drawStars(){
  for (const s of stars){
    s.a += s.speed;
    const tw = 0.5 + Math.sin(s.a)*0.5;
    const alpha = 0.25 + tw*0.65;

    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sctx.fillStyle = `hsla(${s.hue},90%,${75 + tw*18}%,${alpha})`;
    sctx.fill();
  }

  if (Math.random() < 0.004 && shootingStars.length < 3){
    shootingStars.push({
      x: Math.random()*W*0.8,
      y: Math.random()*H*0.5,
      vx: 7 + Math.random()*5,
      vy: 3 + Math.random()*2.5,
      life: 1
    });
  }

  for (let i = shootingStars.length - 1; i >= 0; i--){
    const s = shootingStars[i];
    s.x += s.vx; s.y += s.vy; s.life -= 0.012;

    if (s.life <= 0 || s.x > W + 100){
      shootingStars.splice(i,1);
      continue;
    }

    const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx*8, s.y - s.vy*8);
    g.addColorStop(0, `rgba(255,255,255,${s.life})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');

    sctx.strokeStyle = g;
    sctx.lineWidth = 1.8;
    sctx.beginPath();
    sctx.moveTo(s.x, s.y);
    sctx.lineTo(s.x - s.vx*8, s.y - s.vy*8);
    sctx.stroke();
  }
}

/* ---------- TÊN TỪ HẠT SAO ---------- */
function buildNameParticles(){
  nameParticles = [];

  const off = document.createElement('canvas');
  off.width  = Math.max(1, Math.floor(W));
  off.height = Math.max(1, Math.floor(H));
  const o = off.getContext('2d');
  o.fillStyle = '#fff';
  o.textAlign = 'center';
  o.textBaseline = 'middle';

  const name = (CONFIG.name || '').toUpperCase();
  const line1 = 'HAPPY BIRTHDAY';

  const isPortrait = H > W;
  let size2, size1, centerY, cx;

  if (isPortrait){
    size2 = Math.min(W * 0.22, 92);
    size1 = size2 * 0.42;
    centerY = H * 0.32;
    cx = W / 2;
  } else {
    size2 = Math.min(W * 0.14, H * 0.22);
    size1 = size2 * 0.42;
    centerY = H * 0.35;
    cx = W / 2;
  }

  const y1 = centerY - size2 * 0.85;
  const y2 = centerY + size2 * 0.35;

  o.font = `700 ${size1}px 'Be Vietnam Pro', system-ui, sans-serif`;
  o.shadowColor = 'rgba(0,0,0,1)';
  o.shadowBlur = 0;
  o.fillText(line1, cx, y1);

  o.font = `700 ${size2}px 'Dancing Script', cursive`;
  o.fillText(name, cx, y2);

  const data = o.getImageData(0,0,off.width,off.height).data;
  const step = W > 900 ? 4 : 5;

  for (let y = 0; y < off.height; y += step){
    for (let x = 0; x < off.width; x += step){
      const i = (y * off.width + x) * 4;
      if (data[i+3] > 128){
        nameParticles.push({
          x: Math.random()*W,
          y: Math.random()*H,
          vx: (Math.random()-0.5)*2,
          vy: (Math.random()-0.5)*2,
          tx: x,
          ty: y,
          r: 0.9 + Math.random()*0.9,
          alpha: 0,
          phase: Math.random()*Math.PI*2,
          hue: Math.random() < 0.72 ? 45 : (Math.random() < 0.5 ? 330 : 200)
        });
      }
    }
  }
}

function updateAndDrawNameParticles(){
  for (const p of nameParticles){
    if (phase !== 'intro'){
      const k = 0.055;
      p.vx = (p.vx + (p.tx - p.x) * k) * 0.78;
      p.vy = (p.vy + (p.ty - p.y) * k) * 0.78;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha += (1 - p.alpha) * 0.06;
    } else {
      p.alpha *= 0.9;
    }

    p.phase += 0.06;
    const tw = 0.65 + Math.sin(p.phase) * 0.35;

    // Vầng tối để chữ nổi trên ảnh sáng
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.r * (0.7 + tw*0.6) + 1.5, 0, Math.PI*2);
    fctx.fillStyle = `rgba(0,0,0,${p.alpha * 0.35})`;
    fctx.fill();

    fctx.beginPath();
    fctx.arc(p.x, p.y, p.r * (0.7 + tw*0.6), 0, Math.PI*2);
    fctx.fillStyle = `hsla(${p.hue},100%,75%,${p.alpha * tw})`;
    fctx.fill();
  }
}

/* ---------- CONFETTI ---------- */
function burstConfetti(cx, cy, n){
  n = n || 220;
  const colors = ['#ffd76e','#ff8ec7','#a78bfa','#7dd3fc','#fca5a5','#86efac','#fde68a','#fb923c'];
  for (let i = 0; i < n; i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 7 + Math.random()*14;
    confetti.push({
      x: cx, y: cy,
      vx: Math.cos(ang)*spd,
      vy: Math.sin(ang)*spd - 7,
      life: 1,
      decay: 0.0035 + Math.random()*0.005,
      size: 5 + Math.random()*8,
      color: colors[(Math.random()*colors.length)|0],
      rotation: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.45,
      shape: Math.random() < 0.5 ? 'rect' : 'circle'
    });
  }
}

function drawConfetti(){
  for (let i = confetti.length - 1; i >= 0; i--){
    const c = confetti[i];
    c.vy += 0.28;
    c.vx *= 0.992;
    c.x += c.vx;
    c.y += c.vy;
    c.rotation += c.vr;
    c.life -= c.decay;

    if (c.life <= 0 || c.y > H + 60){
      confetti.splice(i,1);
      continue;
    }

    fctx.save();
    fctx.globalAlpha = Math.max(0, c.life);
    fctx.translate(c.x, c.y);
    fctx.rotate(c.rotation);
    fctx.fillStyle = c.color;
    if (c.shape === 'rect'){
      fctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    } else {
      fctx.beginPath();
      fctx.arc(0,0,c.size/2,0,Math.PI*2);
      fctx.fill();
    }
    fctx.restore();
  }
}

/* ---------- TIM ---------- */
function spawnHeart(){
  hearts.push({
    x: Math.random()*W,
    y: H + 30,
    vy: -(0.7 + Math.random()*1.2),
    drift: (Math.random()-0.5)*0.6,
    size: 8 + Math.random()*14,
    rot: (Math.random()-0.5)*0.6,
    vr: (Math.random()-0.5)*0.02,
    alpha: 0,
    hue: 320 + Math.random()*40
  });
}

function drawHearts(){
  for (let i = hearts.length - 1; i >= 0; i--){
    const h = hearts[i];
    h.y += h.vy;
    h.x += Math.sin(h.y*0.01) * 0.5 + h.drift;
    h.rot += h.vr;
    h.alpha = Math.min(1, h.alpha + 0.02);

    if (h.y < -40){
      hearts.splice(i,1);
      continue;
    }

    const fade = h.y < H*0.25 ? h.y / (H*0.25) : 1;
    const a = h.alpha * fade * 0.75;

    fctx.save();
    fctx.globalAlpha = a;
    fctx.translate(h.x, h.y);
    fctx.rotate(h.rot);
    const s = h.size;
    const g = fctx.createLinearGradient(0,-s,0,s);
    g.addColorStop(0, `hsl(${h.hue},95%,78%)`);
    g.addColorStop(1, `hsl(${h.hue+30},95%,58%)`);
    fctx.fillStyle = g;

    fctx.beginPath();
    fctx.moveTo(0, s*0.35);
    fctx.bezierCurveTo(0, 0, -s, 0, -s, s*0.45);
    fctx.bezierCurveTo(-s, s*0.9, 0, s*1.15, 0, s*1.5);
    fctx.bezierCurveTo(0, s*1.15, s, s*0.9, s, s*0.45);
    fctx.bezierCurveTo(s, 0, 0, 0, 0, s*0.35);
    fctx.closePath();
    fctx.fill();
    fctx.restore();
  }
}

/* ---------- LOOP ---------- */
function loop(){
  drawNebula();
  sctx.clearRect(0,0,W,H);
  drawStars();

  fctx.globalCompositeOperation = 'destination-out';
  fctx.fillStyle = 'rgba(0,0,0,0.30)';
  fctx.fillRect(0,0,W,H);

  fctx.globalCompositeOperation = 'source-over';
  drawConfetti();

  fctx.globalCompositeOperation = 'lighter';
  if (phase !== 'intro') updateAndDrawNameParticles();

  fctx.globalCompositeOperation = 'source-over';
  drawHearts();

  requestAnimationFrame(loop);
}

/* ---------- TYPEWRITER ---------- */
const escapeHtml = s => s.replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function typeWriter(text, myGen){
  let i = 0;
  const cursor = '<span class="cursor"></span>';

  function tick(){
    if (myGen !== gen) return;
    if (i <= text.length){
      const shown = escapeHtml(text.slice(0, i)).replace(/\n/g,'<br>');
      wishBox.innerHTML = shown + cursor;
      i++;
      setTimeout(tick, 38 + Math.random()*45);
    } else {
      wishBox.innerHTML = escapeHtml(text).replace(/\n/g,'<br>') + cursor;
    }
  }
  tick();
}

/* ---------- FLASH ---------- */
function flashScreen(){
  const f = document.createElement('div');
  f.style.cssText = `position:fixed;inset:0;z-index:99;pointer-events:none;
    background:radial-gradient(circle,rgba(255,240,200,.85),rgba(255,180,120,.35),transparent 70%);
    opacity:1;transition:opacity .8s ease;`;
  document.body.appendChild(f);
  requestAnimationFrame(() => f.style.opacity = '0');
  setTimeout(() => f.remove(), 900);
}

/* ---------- HIỆN ẢNH NỀN ---------- */
function revealBackground(myGen){
  if (!CONFIG.photo) return;

  bgPhoto.style.backgroundImage = `url("${CONFIG.photo}")`;

  // Chờ ảnh load xong để tránh chớp
  const img = new Image();
  img.onload = () => {
    if (myGen !== gen) return;
    bgPhoto.classList.add('show');
    bgOverlay.classList.add('show');
    bgShine.classList.add('show');
    nebulaCv.classList.add('show');

    // Bắt đầu zoom chậm sau khi ảnh hiện
    setTimeout(() => {
      if (myGen !== gen) return;
      bgPhoto.classList.add('kenburns');
    }, 800);
  };
  img.onerror = () => {
    // Nếu ảnh lỗi, vẫn hiện nền tối
    if (myGen !== gen) return;
    bgOverlay.classList.add('show');
  };
  img.src = CONFIG.photo;
}

/* ---------- NHẠC ---------- */
function setupMusic(){
  if (!CONFIG.music){
    btnMusic.style.display = 'none';
    return;
  }
  bgm.src = CONFIG.music;
  bgm.volume = 0.55;

  const p = bgm.play();
  if (p && p.then){
    p.then(() => {
      musicOn = true;
      updateMusicBtn();
    }).catch(() => {
      btnMusic.classList.add('pulse');
      const unlock = () => {
        bgm.play().then(() => {
          musicOn = true;
          updateMusicBtn();
          btnMusic.classList.remove('pulse');
        }).catch(()=>{});
        document.removeEventListener('click', unlock);
        document.removeEventListener('touchstart', unlock);
      };
      document.addEventListener('click', unlock);
      document.addEventListener('touchstart', unlock);
    });
  }
}

function updateMusicBtn(){
  btnMusic.textContent = musicOn ? '🔊 Nhạc' : '🔇 Nhạc';
}

btnMusic.addEventListener('click', () => {
  if (musicOn){
    bgm.pause();
    musicOn = false;
  } else {
    bgm.play().then(() => { musicOn = true; updateMusicBtn(); });
  }
  updateMusicBtn();
});

/* ---------- BẮT ĐẦU ---------- */
async function startMain(){
  const myGen = ++gen;

  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('700 100px Pacifico'),
        document.fonts.load('700 100px "Be Vietnam Pro"'),
        document.fonts.load('700 100px "Dancing Script"')
      ]),
      new Promise(r => setTimeout(r, 1200))
    ]);
  } catch(e){}
  if (myGen !== gen) return;

  introScene.classList.add('hidden');
  mainScene.classList.remove('hidden');
  phase = 'forming';

  // Hiện ảnh nền ngay
  revealBackground(myGen);

  // Flash + confetti
  requestAnimationFrame(() => {
    flashScreen();
    burstConfetti(W/2, H/2, 180);
  });
  setTimeout(() => { if (myGen === gen) burstConfetti(W*0.3, H*0.4, 120); }, 180);
  setTimeout(() => { if (myGen === gen) burstConfetti(W*0.7, H*0.4, 120); }, 360);

  buildNameParticles();

  setTimeout(() => { if (myGen === gen) heartsOn = true; }, 1400);

  setTimeout(() => {
    if (myGen !== gen) return;
    phase = 'formed';
    typeWriter(CONFIG.wishes.join('\n'), myGen);
  }, 2900);

  setTimeout(() => { if (myGen === gen) cakeWrap.classList.add('show'); }, 3500);
  setTimeout(() => { if (myGen === gen) topBar.classList.add('show'); }, 4400);
}

/* ---------- RESET ---------- */
function resetAll(){
  gen++;
  phase = 'intro';
  heartsOn = false;

  nameParticles = [];
  confetti = [];
  hearts = [];

  fctx.clearRect(0,0,W,H);

  wishBox.innerHTML = '';
  cakeWrap.classList.remove('show');
  topBar.classList.remove('show');

  bgPhoto.classList.remove('show','kenburns');
  bgOverlay.classList.remove('show');
  bgShine.classList.remove('show');
  nebulaCv.classList.remove('show');

  mainScene.classList.add('hidden');
  introScene.classList.remove('hidden');

  setTimeout(startMain, 900);
}

/* ---------- SPAM TIM ---------- */
setInterval(() => {
  if (heartsOn && document.visibilityState === 'visible'){
    spawnHeart();
  }
}, 420);

/* ---------- EVENTS ---------- */
btnAgain.addEventListener('click', resetAll);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- KHỞI ĐỘNG ---------- */
resize();
loop();
setupMusic();

function autoStart(){ setTimeout(startMain, 1500); }
if (document.readyState === 'complete'){
  autoStart();
} else {
  window.addEventListener('load', autoStart);
}
</script>
</body>
